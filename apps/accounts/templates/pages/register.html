<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Регистрация — Alpine Club</title>
    {% load static %}
    <link href="{% static 'register.css' %}" rel="stylesheet">
</head>
<body>
    <div class="container">
        <form class="window_form" method="post">
            {% csrf_token %}

            <h1>Alpine <span>Club</span></h1>
            <h3>Регистрация</h3>
            <hr>

            {% if messages %}
                <div class="messages">
                    {% for message in messages %}
                        <p class="message">{{ message }}</p>
                    {% endfor %}
                </div>
            {% endif %}

            <div class="form-group">
                <label for="first_name">Первая буква имени</label>
                <input type="text" class="text" id="first_name"
                       name="first_name" placeholder="Введите имя" required>
            </div>

            <div class="form-group">
                <label for="last_name">Фамилия</label>
                <input type="text" class="text" id="last_name"
                       name="last_name" placeholder="Введите фамилию" required>
            </div>

            <div class="form-group">
                <label for="username">Логин</label>
                <input type="text" class="text" id="username"
                       name="username" placeholder="Введите логин" required>
            </div>

            <div class="form-group">
                <label for="password">Пароль</label>
                <input type="password" class="text" id="password"
                       name="password" placeholder="Введите пароль" required>
            </div>

            <p>Уже есть аккаунт? <a href="/login/">Войти</a></p>

            <button type="submit">Зарегистрироваться</button>
        </form>
    </div>
</body>
</html>
