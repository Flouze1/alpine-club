<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Вход — Alpine Club</title>
    {% load static %}
    <link href="{% static 'login.css' %}" rel="stylesheet">
</head>
<body>
    <div class="container">
        <form class="window_form" method="post">
            {% csrf_token %}

            <h1>Alpine <span>Club</span></h1>
            <h3>Вход</h3>
            <hr>

            {% if messages %}
                <div class="messages">
                    {% for message in messages %}
                        <p class="message">{{ message }}</p>
                    {% endfor %}
                </div>
            {% endif %}

            <div class="form-group">
                <label for="username">Логин</label>
                <input type="text" class="text" id="username"
                       name="username" placeholder="Введите логин" required>
            </div>

            <div class="form-group">
                <label for="password">Пароль</label>
                <input type="password" class="text" id="password"
                       name="password" placeholder="Введите пароль" required>
            </div>

            <p>Нет аккаунта? <a href="/register/">Зарегистрироваться</a></p>

            <button type="submit">Войти</button>
        </form>
    </div>
</body>
</html>
